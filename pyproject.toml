[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xplane_apt_convert"
description = "Convert X-Plane airport data to GIS-friendly formats like GeoJSON or ESRI Shapefile."
readme = "README.md"
requires-python = ">=3.6"
license = { text = "MIT" }
keywords = ["geojson", "gis", "geopackage", "airport", "shapefile", "ogr", "airports", "fiona", "xplane", "geobuf", "gpkg", "flatgeobuf"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Games/Entertainment :: Simulation",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "bezier",
    "fiona",
    "numpy",
    "rich",
    "typer",
    "xplane_airports",
]
dynamic = ["version"]

[project.urls]
"Source Code"     = "https://github.com/CarlosBergillos/xplane_apt_convert"

[[project.authors]]
name = "Carlos Bergillos"
email = "c.bergillos.v@gmail.com"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "xplane_apt_convert.__version__" }

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["images"]  # script auxiliar de generación de imágenes, no es código del paquete

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, warnings, orden de imports
# El formateador (ruff format) es la fuente de verdad de la longitud de línea;
# E501 solo dejaría errores en strings/comentarios que el formateador no puede partir.
ignore = ["E501"]

[tool.coverage.run]
source = ["xplane_apt_convert"]
branch = true

[tool.coverage.report]
show_missing = true
